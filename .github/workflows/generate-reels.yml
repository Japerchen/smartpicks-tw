name: Generate original SmartPicksTW Reels
on:
  workflow_dispatch:
  schedule:
    - cron: '30 16 * * 6' # Sunday 00:30 Asia/Taipei
  push:
    paths:
      - "growth/reels_cloud.py"
      - ".github/workflows/generate-reels.yml"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade Pillow
      - name: Produce original educational MP4 files
        run: python growth/reels_cloud.py
      - name: Inspect outputs
        run: |
          ls -lh reels/*.mp4
          test $(find reels -maxdepth 1 -type f -name '*.mp4' | wc -l) -ge 3
      - name: Commit public video assets (no secrets or commissions)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reels/*.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Publish original educational SmartPicksTW Reels"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
