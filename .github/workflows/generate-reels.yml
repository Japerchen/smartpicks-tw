name: Generate original SmartPicksTW Reels
on:
  workflow_dispatch:
  push:
    paths:
      - "growth/reels_cloud.py"
      - ".github/workflows/generate-reels.yml"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade Pillow
      - name: Produce original educational MP4 files
        run: python growth/reels_cloud.py
      - name: Inspect outputs
        run: |
          test -s reels/usb_c_hub.mp4
          test -s reels/phone_stand.mp4
          test -s reels/power_bank.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 reels/usb_c_hub.mp4
      - name: Commit public video assets (no secrets or commissions)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reels/usb_c_hub.mp4 reels/phone_stand.mp4 reels/power_bank.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Publish original educational SmartPicksTW Reels"
            git push
          fi
